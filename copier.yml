_subdirectory: template

project_name:
  type: str
  help: What is your analysis project's name?
  placeholder: My Analysis
  validator: >-
    {% if not project_name.strip() %}
    Invalid project name
    {% endif %}

project_description:
  type: str
  help: What does your analysis investigate, in one sentence?
  placeholder: Analysis of spectral data from the XYZ experiment.
  validator: >-
    {% if not project_description.strip() %}
    Invalid project description
    {% endif %}

project_url:
  type: str
  help: What is the URL of your project's repository?
  placeholder: https://github.com/user/my-analysis
  validator: >-
    {% if not project_url.startswith("https://") %}
    Invalid project URL
    {% endif %}

author_name:
  type: str
  help: What is the name of your project's primary author? (e.g. "Jane Smith")
  placeholder: Jane Smith
  validator: >-
    {% if not author_name.strip() %}
    Invalid author name
    {% endif %}

author_email:
  type: str
  help: What is the email address of your project's primary author?
  placeholder: jane@example.com
  validator: >-
    {% if not "@" in author_email %}
    Invalid author email address
    {% endif %}

python_version:
  type: str
  help: Which Python version should your project use?
  default: "3.12"

ci:
  type: str
  help: Which CI/CD provider would you like to use?
  choices:
    GitHub Actions: github
    GitLab CI/CD: gitlab
  default: "{% if 'github' in project_url %}github{% else %}gitlab{% endif %}"
  when: "{{ 'github' not in project_url and 'gitlab' not in project_url }}"

typing:
  type: str
  help: Do you want to use optional or strict typing and linting?
  choices:
    - optional
    - strict
  default: optional

with_conventional_commits:
  type: bool
  help: Do you want to follow the Conventional Commits standard (https://www.conventionalcommits.org) for your commit messages?
  default: true

with_jupytext:
  type: bool
  help: Do you want to pair notebooks with plain-text .py files using Jupytext, so that git tracks the .py files instead of .ipynb files?
  default: true

with_dvc:
  type: bool
  help: Do you want to version large data files with DVC (https://dvc.org)?
  default: false

with_snakemake:
  type: bool
  help: Do you want to define a reproducible analysis workflow with Snakemake (https://snakemake.github.io)?
  default: false

with_citation:
  type: bool
  help: Do you want paper and citation metadata (CITATION.cff and a data provenance and dictionary template)?
  default: false

citation_license:
  type: str
  help: Which SPDX licence identifier should CITATION.cff declare? (You still need to add the licence text file yourself.)
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - CC-BY-4.0
  default: MIT
  when: "{{ with_citation }}"

author_orcid:
  type: str
  help: "What is the author's ORCID iD URL? (optional, e.g. https://orcid.org/0000-0000-0000-0000)"
  default: ""
  when: "{{ with_citation }}"

project_name_kebab_case:
  when: false
  default: "{{ project_name | lower | replace(' ', '-') }}"

project_name_snake_case:
  when: false
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

author_given_names:
  when: false
  default: "{{ author_name.strip().split()[:-1] | join(' ') }}"

author_family_names:
  when: false
  default: "{{ author_name.strip().split()[-1] }}"

documentation_url:
  when: false
  default: "{% if ci == 'github' %}https://{{ project_url.rstrip('/').split('/')[-2] }}.github.io/{{ project_url.rstrip('/').split('/')[-1] }}{% else %}{{ project_url }}{% endif %}"
