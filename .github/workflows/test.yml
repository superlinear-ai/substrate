name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        extras: ["none", "all"]
        typing: ["optional", "strict"]

    name: "Python ${{ matrix.python-version }} extras=${{ matrix.extras }} with ${{ matrix.typing }} typing"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: substrate

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Scaffold Python project
        run: |
          extras=$([ "${{ matrix.extras }}" == "all" ] && echo true || echo false)
          uvx copier copy --vcs-ref=HEAD substrate my-project             --defaults             --data project_name="My Project"             --data project_description="An analysis of simulated data."             --data project_url="https://github.com/user/repo"             --data author_name="Jane Smith"             --data author_email="jane@example.com"             --data python_version="${{ matrix.python-version }}"             --data typing="${{ matrix.typing }}"             --data with_jupytext=$extras             --data with_dvc=$extras             --data with_snakemake=$extras             --data with_citation=$extras
          cd my-project
          git config --global init.defaultBranch main
          git init
          git checkout -b test
          git add .

      - name: Lint and test project
        uses: devcontainers/ci@v0.3
        with:
          subFolder: ./my-project/
          runCmd: |
            uv lock
            poe lint
            poe test
