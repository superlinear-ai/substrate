[project]
name = "substrate"
version = "2.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "commitizen>=4.17.1",
    "copier>=9.17.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.commitizen]
bump_message = "bump: v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "uv"
